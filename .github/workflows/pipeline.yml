name: Java CI/CD Pipeline

# Fluxo (D21):
#   PR para develop ou main  → build + testes unitários + testes de integração
#   push na develop          → testes + imagem no ECR + deploy em homolog
#   push na main             → testes + imagem no ECR + deploy em prod
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-backend
  EKS_CLUSTER_NAME: eks-tech-challenge
  K8S_DEPLOYMENT: tech-challenge-app
  K8S_CONTAINER: app

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tech-challenge-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - run: chmod +x mvnw

      - name: Compilar e empacotar (sem testes)
        run: ./mvnw clean package -DskipTests -B

  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./tech-challenge-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - run: chmod +x mvnw

      - name: Testes unitários e de arquitetura
        run: ./mvnw test -Dtest='!CucumberRunnerTest,!*IT' -B

      - name: Relatório JaCoCo
        if: always()
        run: ./mvnw jacoco:report -B

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-unit
          path: tech-challenge-backend/target/site/jacoco/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: tech-challenge-backend/target/surefire-reports/

  integration-test:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./tech-challenge-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'tech-challenge-backend/pom.xml'

      - run: chmod +x mvnw

      # Inclui o SchemaFlywayIT: todas as migrations em PostgreSQL 16 real e
      # validação das entidades contra o schema (ddl-auto: validate).
      - name: Testes de integração (Failsafe + Testcontainers)
        run: ./mvnw verify -Pintegration-tests -Dsurefire.skip=true -B

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failsafe-reports
          path: tech-challenge-backend/target/failsafe-reports/

  image:
    name: Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push da imagem
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./tech-challenge-backend
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'homolog' }})
    runs-on: ubuntu-latest
    needs: image
    # homolog só aceita deploy da develop e prod só da main (environments do GitHub).
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: kubeconfig do EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      # Contrato via SSM (ADR-001 e ADR-010): banco e segredos gerados pelo infra-db.
      - name: Secret do Kubernetes a partir do SSM
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          ssm() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text; }
          DB_HOST=$(ssm /tech-challenge/shared/db-host)
          DB_PORT=$(ssm /tech-challenge/shared/db-port)
          DB_NAME=$(ssm "/tech-challenge/$ENVIRONMENT/db-name")
          DB_USER=$(ssm "/tech-challenge/$ENVIRONMENT/db-app-user")
          DB_PASS=$(ssm "/tech-challenge/$ENVIRONMENT/db-app-password")
          JWT_SECRET=$(ssm "/tech-challenge/$ENVIRONMENT/jwt-secret")
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT_SECRET"
          kubectl -n "$ENVIRONMENT" create secret generic tech-challenge-secrets \
            --from-literal=SPRING_DATASOURCE_URL="jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_NAME?sslmode=require" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$DB_USER" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DB_PASS" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          echo "Secret tech-challenge-secrets atualizado em $ENVIRONMENT"

      - name: Aplicar manifests do ambiente com a imagem do commit
        working-directory: ./tech-challenge-backend
        run: |
          kubectl kustomize "k8s/overlays/$ENVIRONMENT" \
            | sed "s#image: tech-challenge-backend\$#image: $IMAGE#" \
            | kubectl apply -f -

      - name: Aguardar rollout
        run: kubectl -n "$ENVIRONMENT" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=600s

      - name: Health check pelo API Gateway
        run: |
          API=$(aws ssm get-parameter --name "/tech-challenge/$ENVIRONMENT/apigateway-api-endpoint" --query Parameter.Value --output text)
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API/actuator/health")
            [ "$code" = "200" ] && { echo "OK: $API/actuator/health"; exit 0; }
            sleep 10
          done
          echo "::error::health check pelo gateway falhou (último status $code)"
          exit 1
