# Homologação: namespace homolog (criado pelo infra-k8s), 1 réplica (orçamento
# do lab, D31), NodePort 30081.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homolog

resources:
  - ../../base

labels:
  - pairs:
      environment: homolog
    includeSelectors: false

replicas:
  - name: tech-challenge-app
    count: 1

patches:
  - target:
      kind: Service
      name: tech-challenge-app
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
  # Com 1 réplica, o PDB não pode exigir 1 disponível (bloquearia drenar o nó).
  - target:
      kind: PodDisruptionBudget
      name: tech-challenge-app
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

configMapGenerator:
  - name: tech-challenge-config
    behavior: merge
    literals:
      - APP_ENVIRONMENT=homolog
      - NEW_RELIC_APP_NAME=tech-challenge-backend (homolog)
      - NEW_RELIC_LABELS=environment:homolog
