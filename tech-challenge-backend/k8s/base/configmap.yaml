apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-challenge-config
data:
  FLYWAY_ENABLED: "true"
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_FROM: noreply@oficina-mecanica.com.br
  # O health check de e-mail depende de autenticacao SMTP valida. Como o envio
  # de e-mail nao e essencial para a API servir trafego, o indicador fica
  # desabilitado para nao derrubar as probes do Kubernetes (readiness/liveness).
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_COM_FIAP: INFO
  # Logs JSON (ECS) com os campos do MDC, incluindo o correlationId (RFC-005).
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  # Atrás do API Gateway e do NLB: usa X-Forwarded-Proto/Host para gerar URLs
  # (ex.: o servidor https:// anunciado pelo OpenAPI/Swagger).
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  # RDS db.t3.micro aceita só 81 conexões (max_connections). Com prod em até 6
  # pods + homolog + Lambda, 10 por pod (padrão do Hikari) esgotava o banco.
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
